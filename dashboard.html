<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Saturn-Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06070A;
    --bg-2: #0A0C11;
    --card: #12151C;
    --card-2: #181C25;
    --field: #14171F;
    --line: #262B35;
    --line-soft: rgba(255,255,255,0.06);
    --text: #EDEBE4;
    --text-dim: #8B93A4;
    --text-faint: #565E6E;
    --gold: #D4AF37;
    --gold-bright: #F0CB6A;
    --gold-dim: #8C7222;
    --amber: #C98A4B;
    --good: #7FAE8C;
    --bad: #C97757;
    --focus: rgba(212,175,55,0.30);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    position:relative;
    padding-bottom:78px; /* alt nav için yer */
  }
  h1,h2{ font-family:'Inter',sans-serif; font-weight:500; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  a{ color:inherit; text-decoration:none; }

  /* --- Saturn halkaları arka planı --- */
  body::before{
    content:'';
    position:fixed; inset:0;
    z-index:0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(237,235,228,0.22), transparent),
      radial-gradient(1px 1px at 30% 55%, rgba(237,235,228,0.16), transparent),
      radial-gradient(1.5px 1.5px at 45% 85%, rgba(237,235,228,0.18), transparent),
      radial-gradient(1px 1px at 70% 30%, rgba(237,235,228,0.14), transparent),
      radial-gradient(1px 1px at 90% 70%, rgba(237,235,228,0.18), transparent);
    background-repeat:no-repeat;
    pointer-events:none;
  }
  .saturn-wrap{
    position:fixed;
    top:-140px; right:-160px;
    width:440px; height:440px;
    z-index:0;
    pointer-events:none;
    opacity:0.5;
  }
  .saturn-planet{
    position:absolute; top:50%; left:50%;
    width:220px; height:220px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 32% 28%, var(--gold-bright), var(--gold) 50%, var(--amber) 100%);
    box-shadow:0 0 90px -10px rgba(212,175,55,0.35);
  }
  .saturn-ring{
    position:absolute; top:50%; left:50%;
    border-radius:50%;
    border:1.5px solid var(--gold-dim);
    transform:translate(-50%,-50%) rotate(-20deg);
  }
  .saturn-ring.r1{ width:400px; height:130px; border-color:rgba(140,114,34,0.55); }
  .saturn-ring.r2{ width:440px; height:145px; border-color:rgba(212,175,55,0.28); }
  .saturn-ring.r3{ width:360px; height:118px; border-color:rgba(240,203,106,0.35); }

  main{ max-width:520px; margin:0 auto; padding:0 20px; position:relative; z-index:2; }

  /* --- Top bar --- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 6px;
    max-width:520px;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  .avatar-btn{
    width:38px; height:38px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--card-2), var(--card));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--text-dim);
    font-size:16px;
    transition:border-color .15s ease;
  }
  .avatar-btn:hover{ border-color:var(--gold-dim); }
  .brand-mini{
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
    letter-spacing:0.02em;
  }
  .bell-btn{
    width:38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
    font-size:17px;
    background:transparent;
    border:none;
    cursor:pointer;
    position:relative;
  }
  .bell-dot{
    position:absolute; top:7px; right:8px;
    width:7px; height:7px;
    border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px rgba(240,203,106,0.7);
  }

  /* --- Total assets --- */
  .assets-block{ padding:22px 20px 6px; }
  .assets-label{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--text-dim); margin-bottom:10px;
  }
  .eye-toggle{
    background:none; border:none; color:var(--text-faint);
    cursor:pointer; font-size:13px; padding:2px;
  }
  .assets-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }
  .assets-value{
    font-family:'Inter',sans-serif; font-weight:500;
    font-size:38px; letter-spacing:-0.02em; color:var(--text);
  }
  .assets-value .unit{ font-size:16px; color:var(--text-dim); margin-left:6px; font-family:'Inter',sans-serif; }
  .deposit-btn{
    flex-shrink:0;
    padding:12px 22px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#141008;
    transition:box-shadow .15s ease, transform .12s ease;
  }
  .deposit-btn:hover{ box-shadow:0 8px 20px -6px rgba(212,175,55,0.45); }
  .deposit-btn:active{ transform:translateY(1px); }

  .pnl-row{
    margin-top:10px;
    font-size:13px;
    color:var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .pnl-value.pos{ color:var(--good); }
  .pnl-value.neg{ color:var(--bad); }
  .pnl-value.flat{ color:var(--text-faint); }

  /* --- chart --- */
  .chart-card{
    margin:22px 20px 0;
    padding:16px 4px 4px;
  }
  .chart-wrap{ width:100%; height:150px; position:relative; }
  .chart-wrap canvas{ width:100%; height:100%; display:block; }

  .range-tabs{
    display:flex;
    gap:6px;
    padding:14px 16px 0;
  }
  .range-tab{
    padding:6px 13px;
    border-radius:999px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .range-tab:hover{ color:var(--text-dim); }
  .range-tab.active{
    color:var(--gold-bright);
    border-color:var(--gold-dim);
    background:rgba(212,175,55,0.08);
  }

  .last-updated{
    padding:12px 20px 0;
    font-size:11px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
  }

  /* --- Active invests panel --- */
  .invest-card{
    margin:20px 20px 0;
    background:linear-gradient(175deg, var(--card-2), var(--card));
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:22px 20px;
    box-shadow:0 20px 50px -24px rgba(0,0,0,0.55);
    position:relative;
    overflow:hidden;
  }
  .invest-card::before{
    content:'';
    position:absolute; top:-60%; right:-20%;
    width:240px; height:240px;
    background:radial-gradient(circle, rgba(212,175,55,0.1), transparent 70%);
    pointer-events:none;
  }
  .invest-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; position:relative;
  }
  .invest-title{
    font-size:11px; color:var(--gold);
    font-family:'IBM Plex Mono',monospace; font-weight:500;
    letter-spacing:0.09em; text-transform:uppercase;
  }
  .invest-viewall{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:4px; }
  .invest-viewall:hover{ color:var(--gold-bright); }

  .invest-summary{
    display:flex; gap:24px; margin-bottom:18px; position:relative;
  }
  .invest-stat .n{ font-family:'Inter',sans-serif; font-size:22px; color:var(--text); }
  .invest-stat .l{ font-size:11px; color:var(--text-faint); margin-top:2px; }

  .invest-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0;
    border-top:1px solid var(--line-soft);
    position:relative;
  }
  .invest-row:first-of-type{ border-top:none; }
  .invest-main{ display:flex; align-items:center; gap:11px; min-width:0; }
  .invest-badge{
    width:30px; height:30px; border-radius:50%;
    background:rgba(212,175,55,0.12); color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; flex-shrink:0;
  }
  .invest-desc{ font-size:13.5px; color:var(--text); }
  .invest-date{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; margin-top:1px; }
  .invest-amount{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--good); flex-shrink:0; }

  .invest-empty{ color:var(--text-dim); font-size:13px; text-align:center; padding:14px 0; position:relative; }

  /* --- bottom nav --- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    z-index:5;
    background:rgba(10,12,17,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line-soft);
    display:flex;
  }
  .nav-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:11px 4px 9px;
    color:var(--text-faint);
    font-size:10.5px;
    cursor:pointer;
    transition:color .15s ease;
  }
  .nav-item .icon{ font-size:19px; line-height:1; }
  .nav-item .icon svg{ width:21px; height:21px; display:block; }
  .nav-item:hover{ color:var(--text-dim); }
  .nav-item.active{ color:var(--gold-bright); }

  @media (max-width:480px){
    .assets-value{ font-size:32px; }
  }
</style>
</head>
<body>

  <div class="saturn-ring r1"></div>

  <div class="saturn-ring r3"></div>

<div class="topbar">
  <button class="avatar-btn" id="avatarBtn" title="Ayarlar" aria-label="Ayarlar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.3-3.5 4.2-5.5 7.5-5.5s6.2 2 7.5 5.5"/></svg>
  </button>
  <span class="brand-mini">Saturn-Pay</span>
  <button class="bell-btn" id="bellBtn" title="Bildirimler" aria-label="Bildirimler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M6 10a6 6 0 0 1 12 0c0 3.2 1 4.8 1.6 5.6.3.4 0 1-.5 1H4.9c-.5 0-.8-.6-.5-1C5 14.8 6 13.2 6 10Z"/><path d="M9.5 19a2.6 2.6 0 0 0 5 0"/></svg>

<script>
  const TX_KEY = 'saturnpay_transactions';

  function daysAgoISO(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.toISOString();
  }
  function makeId() {
    return 'tx_' + Math.random().toString(36).slice(2, 10);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function formatUSD(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  }
  function formatDateTR(iso) {
    return new Date(iso).toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function loadTransactions(user) {
    const raw = localStorage.getItem(TX_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      } catch (e) { /* yeniden oluştur */ }
    }
    let seed;
    if (typeof user.balance === 'number' && user.balance > 0) {
      seed = [{ id: makeId(), description: 'Başlangıç bakiyesi', amount: user.balance, date: daysAgoISO(0) }];
    } else {
      seed = [
        { id: makeId(), description: 'USDT Yatırma (TRC20)', amount: 250, date: daysAgoISO(14) },
        { id: makeId(), description: 'USDT Yatırma (ERC20)', amount: 500, date: daysAgoISO(9) },
        { id: makeId(), description: 'USDT Çekme (TRC20)', amount: -120, date: daysAgoISO(2) },
      ];
    }
    localStorage.setItem(TX_KEY, JSON.stringify(seed));
    return seed;
  }

  function computeBalance(txs) {
    return txs.reduce((sum, t) => sum + t.amount, 0);
  }

  // --- auth ---
  const token = localStorage.getItem('saturnpay_token');
  const userRaw = localStorage.getItem('saturnpay_user');
  if (!token) { window.location.href = 'login.html'; }
  let user = {};
  try { user = JSON.parse(userRaw || '{}'); } catch (e) { user = {}; }

  let transactions = loadTransactions(user);
  let balanceHidden = false;
  let currentRangeDays = 7;

  // --- top bar ---
  document.getElementById('avatarBtn').addEventListener('click', () => {
    window.location.href = 'settings.html';
  });
  document.getElementById('bellBtn').addEventListener('click', () => {
    alert('Şu an yeni bildiriminiz yok.');
  });

  // --- assets / balance ---
  function renderAssets() {
    const balance = computeBalance(transactions);
    const el = document.getElementById('assetsValue');
    if (balanceHidden) {
      el.innerHTML = '••••••<span class="unit">USD</span>';
    } else {
      el.innerHTML = formatUSD(balance).replace('$', '$') + '<span class="unit">USD</span>';
    }

    // bugünkü net değişim (basit P&L)
    const today = new Date().toDateString();
    const todayTxs = transactions.filter(t => new Date(t.date).toDateString() === today);
    const todayNet = todayTxs.reduce((s, t) => s + t.amount, 0);
    const baseline = balance - todayNet;
    const pct = baseline !== 0 ? (todayNet / Math.abs(baseline)) * 100 : 0;

    const pnlEl = document.getElementById('pnlValue');
    const sign = todayNet > 0 ? '+' : '';
    pnlEl.textContent = `${sign}${formatUSD(todayNet)} (${sign}${pct.toFixed(2)}%)`;
    pnlEl.className = 'pnl-value ' + (todayNet > 0 ? 'pos' : todayNet < 0 ? 'neg' : 'flat');
  }

  document.getElementById('eyeToggle').addEventListener('click', () => {
    balanceHidden = !balanceHidden;
    renderAssets();
  });

  document.getElementById('depositBtn').addEventListener('click', () => {
    window.location.href = 'deposit.html';
  });

  // --- active invests (yatırım = pozitif tutarlı işlemler) ---
  function renderInvests() {
    const invests = transactions.filter(t => t.amount > 0);
    const total = invests.reduce((s, t) => s + t.amount, 0);
    document.getElementById('investCount').textContent = invests.length;
    document.getElementById('investTotal').textContent = formatUSD(total);

    const recent = [...invests].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 3);
    const listEl = document.getElementById('investList');
    if (recent.length === 0) {
      listEl.innerHTML = '<div class="invest-empty">Henüz aktif bir yatırımınız yok.</div>';
      return;
    }
    listEl.innerHTML = recent.map(t => `
      <div class="invest-row">
        <div class="invest-main">
          <div class="invest-badge">↑</div>
          <div>
            <div class="invest-desc">${escapeHtml(t.description)}</div>
            <div class="invest-date">${formatDateTR(t.date)}</div>
          </div>
        </div>
        <div class="invest-amount">${formatUSD(t.amount)}</div>
      </div>
    `).join('');
  }

  // --- chart (seçilen zaman aralığına göre) ---
  function drawChart(days) {
    const canvas = document.getElementById('balanceChart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const W = rect.width || 300;
    const H = rect.height || 150;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const sorted = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
    let running = 0;
    const allPoints = sorted.map(t => {
      running += t.amount;
      return { date: new Date(t.date), balance: running };
    });

    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    // seçilen aralıktan önceki bakiyeyi başlangıç noktası yap
    let baseBalance = 0;
    allPoints.forEach(p => { if (p.date < cutoff) baseBalance = p.balance; });
    let points = allPoints.filter(p => p.date >= cutoff);
    points.unshift({ date: cutoff, balance: baseBalance });
    if (points.length === 1) points.push({ date: new Date(), balance: baseBalance });

    const values = points.map(p => p.balance);
    const minV = Math.min(...values, 0);
    const maxV = Math.max(...values, minV + 1);
    const pad = 12;
    const usableH = H - pad * 2;
    const usableW = W - pad * 2;
    const xFor = i => pad + (i / (points.length - 1)) * usableW;
    const yFor = v => pad + usableH - ((v - minV) / (maxV - minV)) * usableH;

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 2; i++) {
      const y = pad + (usableH / 2) * i;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    const grad = ctx.createLinearGradient(0, pad, 0, pad + usableH);
    grad.addColorStop(0, 'rgba(212,175,55,0.28)');
    grad.addColorStop(1, 'rgba(212,175,55,0)');
    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i), y = yFor(p.balance);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.lineTo(xFor(points.length - 1), pad + usableH);
    ctx.lineTo(xFor(0), pad + usableH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    points.forEach((p, i) => {
      const x = xFor(i), y = yFor(p.balance);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#F0CB6A';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    const lastX = xFor(points.length - 1), lastY = yFor(points[points.length - 1].balance);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#F0CB6A';
    ctx.shadowColor = 'rgba(240,203,106,0.8)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    const nowStr = new Date().toLocaleString('tr-TR', {
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
    document.getElementById('lastUpdated').textContent = `Son güncelleme: ${nowStr}`;
  }

  document.getElementById('rangeTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.range-tab');
    if (!btn) return;
    [...document.querySelectorAll('.range-tab')].forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentRangeDays = parseInt(btn.dataset.days, 10);
    drawChart(currentRangeDays);
  });

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }
  window.addEventListener('resize', debounce(() => drawChart(currentRangeDays), 150));

  function renderAll() {
    renderAssets();
    renderInvests();
    drawChart(currentRangeDays);
  }

  renderAll();
</script>

</body>
</html>
