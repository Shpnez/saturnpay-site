<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investments — Saturn-Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06070A; --card: #12151C; --card-2: #181C25; --field: #14171F;
    --line: #262B35; --line-soft: rgba(255,255,255,0.06);
    --text: #EDEBE4; --text-dim: #8B93A4; --text-faint: #565E6E;
    --gold: #D4AF37; --gold-bright: #F0CB6A; --gold-dim: #8C7222; --amber: #C98A4B;
    --good: #7FAE8C; --bad: #C97757;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:78px; }
  h1,h2{ font-family:'Inter',sans-serif; font-weight:500; }
  a{ color:inherit; text-decoration:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 6px; max-width:520px; margin:0 auto;
  }
  .avatar-btn{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(160deg, var(--card-2), var(--card));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-dim);
  }
  .avatar-btn svg{ width:17px; height:17px; }
  .avatar-btn:hover{ border-color:var(--gold-dim); }
  .brand-mini{ font-size:15px; font-weight:600; color:var(--text-dim); letter-spacing:0.02em; }
  .bell-btn{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); background:transparent; border:none; cursor:pointer; position:relative;
  }
  .bell-btn svg{ width:19px; height:19px; }
  .bell-dot{
    position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 6px rgba(240,203,106,0.7);
  }

  main{ max-width:520px; margin:0 auto; padding:14px 20px 40px; }

  .page-head{ padding:8px 0 18px; }
  .page-head h1{ font-size:21px; margin-bottom:4px; }
  .page-head p{ color:var(--text-dim); font-size:13px; }

  .filter-tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .filter-tab{
    padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--field); color:var(--text-dim);
    font-size:12.5px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .filter-tab:hover{ border-color:var(--gold-dim); color:var(--text); }
  .filter-tab.active{
    border-color:var(--gold); background:rgba(212,175,55,0.1); color:var(--gold-bright);
  }

  .card{
    background:linear-gradient(175deg, var(--card-2), var(--card));
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:20px 20px 8px;
  }

  .tx-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0; border-top:1px solid var(--line-soft); gap:12px;
  }
  .tx-row:first-child{ border-top:none; padding-top:0; }
  .tx-main{ display:flex; align-items:center; gap:12px; min-width:0; }
  .tx-badge{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0;
  }
  .tx-badge.in{ background:rgba(127,174,140,0.15); color:var(--good); }
  .tx-badge.out{ background:rgba(201,119,87,0.15); color:var(--bad); }
  .tx-desc{ font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-date{ font-size:11.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
  .tx-amount{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; flex-shrink:0; }
  .tx-amount.in{ color:var(--good); }
  .tx-amount.out{ color:var(--bad); }
  .empty-note{ color:var(--text-dim); font-size:13px; text-align:center; padding:24px 0; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:rgba(10,12,17,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line-soft); display:flex;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:11px 4px 9px; color:var(--text-faint); font-size:10.5px; cursor:pointer;
    transition:color .15s ease;
  }
  .nav-item .icon{ font-size:19px; line-height:1; }
  .nav-item .icon svg{ width:21px; height:21px; display:block; }
  .nav-item:hover{ color:var(--text-dim); }
  .nav-item.active{ color:var(--gold-bright); }
</style>
</head>
<body>

<div class="topbar">
  <button class="avatar-btn" id="avatarBtn" title="Ayarlar" aria-label="Ayarlar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.3-3.5 4.2-5.5 7.5-5.5s6.2 2 7.5 5.5"/></svg>
  </button>
  <span class="brand-mini">Saturn-Pay</span>
  <button class="bell-btn" id="bellBtn" title="Bildirimler" aria-label="Bildirimler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 3.2 1 4.8 1.6 5.6.3.4 0 1-.5 1H4.9c-.5 0-.8-.6-.5-1C5 14.8 6 13.2 6 10Z"/><path d="M9.5 19a2.6 2.6 0 0 0 5 0"/></svg>
    <span class="bell-dot"></span>
  </button>
</div>

<main>
  <div class="page-head">
    <h1>Investments</h1>
    <p>Tüm para yatırma ve çekme işlemleriniz.</p>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">Tümü</button>
    <button class="filter-tab" data-filter="in">Yatırım</button>
    <button class="filter-tab" data-filter="out">Çekim</button>
  </div>

  <div class="card">
    <div id="txList"></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V19a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5"/></svg></span>Home
  </a>
  <a href="investments.html" class="nav-item active">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 11l4 4 8-8"/><path d="M14 6h7v7"/></svg></span>Investments
  </a>
  <a href="invests.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg></span>Invests
  </a>
  <a href="referral.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 13h16"/><path d="M12 9v11"/><path d="M12 9c-1.2 0-3-1-3-2.6C9 5.1 10 4 11.3 4 12.7 4 12 7 12 9Z"/><path d="M12 9c1.2 0 3-1 3-2.6C15 5.1 14 4 12.7 4 11.3 4 12 7 12 9Z"/></svg></span>Referral
  </a>
  <a href="assets.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.6"/></svg></span>Assets
  </a>
</nav>

<script>
  const TX_KEY = 'saturnpay_transactions';

  function daysAgoISO(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.toISOString();
  }
  function makeId() { return 'tx_' + Math.random().toString(36).slice(2, 10); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function formatUSD(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
  }
  function formatDateTR(iso) {
    return new Date(iso).toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function loadTransactions(user) {
    const raw = localStorage.getItem(TX_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      } catch (e) { /* yeniden oluştur */ }
    }
    let seed;
    if (typeof user.balance === 'number' && user.balance > 0) {
      seed = [{ id: makeId(), description: 'Başlangıç bakiyesi', amount: user.balance, date: daysAgoISO(0) }];
    } else {
      seed = [
        { id: makeId(), description: 'USDT Yatırma (TRC20)', amount: 250, date: daysAgoISO(14) },
        { id: makeId(), description: 'USDT Yatırma (ERC20)', amount: 500, date: daysAgoISO(9) },
        { id: makeId(), description: 'USDT Çekme (TRC20)', amount: -120, date: daysAgoISO(2) },
      ];
    }
    localStorage.setItem(TX_KEY, JSON.stringify(seed));
    return seed;
  }

  const token = localStorage.getItem('saturnpay_token');
  const userRaw = localStorage.getItem('saturnpay_user');
  if (!token) { window.location.href = 'login.html'; }
  let user = {};
  try { user = JSON.parse(userRaw || '{}'); } catch (e) { user = {}; }

  const transactions = loadTransactions(user);
  let currentFilter = 'all';

  document.getElementById('avatarBtn').addEventListener('click', () => window.location.href = 'settings.html');
  document.getElementById('bellBtn').addEventListener('click', () => alert('Şu an yeni bildiriminiz yok.'));

  function renderTx() {
    const list = document.getElementById('txList');
    let filtered = [...transactions];
    if (currentFilter === 'in') filtered = filtered.filter(t => t.amount >= 0);
    if (currentFilter === 'out') filtered = filtered.filter(t => t.amount < 0);
    const sorted = filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (sorted.length === 0) {
      list.innerHTML = '<p class="empty-note">Bu filtrede işlem yok.</p>';
      return;
    }
    list.innerHTML = sorted.map(t => {
      const isIn = t.amount >= 0;
      return `
        <div class="tx-row">
          <div class="tx-main">
            <div class="tx-badge ${isIn ? 'in' : 'out'}">${isIn ? '↓' : '↑'}</div>
            <div style="min-width:0;">
              <div class="tx-desc">${escapeHtml(t.description)}</div>
              <div class="tx-date">${formatDateTR(t.date)}</div>
            </div>
          </div>
          <div class="tx-amount ${isIn ? 'in' : 'out'}">${isIn ? '+' : ''}${formatUSD(t.amount)}</div>
        </div>`;
    }).join('');
  }

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    [...document.querySelectorAll('.filter-tab')].forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTx();
  });

  renderTx();
</script>

</body>
</html>
